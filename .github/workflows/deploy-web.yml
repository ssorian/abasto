name: Deploy web

# Pull requests run checks only.
# Push to dev  -> builds, migrates and deploys the `staging` environment.
# Push to main -> builds, migrates and deploys the `production` environment.
# Each GitHub environment holds its own secrets under the same names.
on:
  pull_request:
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/deploy-web.yml'
  push:
    branches: [main, dev]
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/abasto-web
  MIGRATE_IMAGE: ghcr.io/${{ github.repository_owner }}/abasto-web-migrate
  # main -> production, dev -> staging. Other refs never deploy (see `build.if`).
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  # Moving tag Dokploy pulls for each environment.
  CHANNEL_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

jobs:
  # Reports lint and formatting. Not a deploy gate yet: main still has existing
  # lint/format debt. Add `needs: check` to `build` once both pass on main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --filter abasto-web
      - run: bun run web:lint
      - run: bun run web:check

  build:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: abasto-web/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.CHANNEL_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          # Per-environment variable: VITE_* values are baked in at build time.
          build-args: VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
          cache-from: type=gha,scope=abasto-web
          cache-to: type=gha,mode=max,scope=abasto-web
      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: abasto-web/Dockerfile
          target: migrate
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ env.CHANNEL_TAG }}
            ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=abasto-web

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      # The database only listens on the Dokploy network, so migrations run on
      # the server itself, against the exact image built by this commit.
      - name: Run migrations on the server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_REF: ${{ env.MIGRATE_IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,DATABASE_URL,MIGRATE_REF
          script_stop: true
          script: |
            set -eu
            # Throwaway Docker config so this login never touches Dokploy's credentials.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$MIGRATE_REF"
            docker run --rm --network dokploy-network -e DATABASE_URL "$MIGRATE_REF"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"
