name: Web CI

# Deployment is owned by Dokploy (GitHub provider, autodeploy):
#   dev  -> staging app, main -> production app.
# This workflow only checks the code and that the production image builds.
on:
  pull_request:
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'abasto-web/**'
      - 'package.json'
      - 'bun.lock'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and formatting report. main still has existing lint/format debt, so
  # this job is informational until it passes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --filter abasto-web
      - run: bun run web:lint
      - run: bun run web:check

  # Same Dockerfile Dokploy builds: catches a broken image before it deploys.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: abasto-web/Dockerfile
          push: false
          cache-from: type=gha,scope=abasto-web
          cache-to: type=gha,mode=max,scope=abasto-web
